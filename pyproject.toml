[project]
name = "alicectl"
version = "0.1.0"
description = "Set up and control Yandex Stations and your Alice smart home from the command line"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.1.0",
    "httpx2>=2.16.2",
    "python-dotenv>=1.2.4",
    "websockets>=17.4",
    "zeroconf>=0.154.0",
]

[project.scripts]
alicectl = "alicectl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alicectl"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "RET", "PTH", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
